openapi: 3.0.3
info:
  title: End User Info API
  version: "1.0.0"
  description: API для создания и получения пользовательской информации (вес/рост/возраст/дата).
servers:
  - url: http://localhost:8080
tags:
  - name: user-info
    description: Операции над пользовательской инфой

paths:
  /api/v1/user-info:
    post:
      tags: [user-info]
      summary: Создать запись user_info
      operationId: createUserInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInfoRequest'
            examples:
              example-1:
                value:
                  user_id: "11111111-1111-1111-1111-111111111111"
                  weight: 82.5
                  height: 180
                  age: 25
                  date: "2025-02-10"
      responses:
        "200":
          description: Успешно создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
              examples:
                example-1:
                  value:
                    weight: 82.5
                    height: 180
                    age: 25
                    date: "2025-02-10"
        "400":
          description: Неверный запрос (валидация/парсинг)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [user-info]
      summary: Получить все записи по user_id
      operationId: listUserInfo
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: Список записей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserInfoResponse'
        "400":
          description: Неверный user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Данные не найдены для данного user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/user-info/latest:
    get:
      tags: [user-info]
      summary: Получить последнюю запись по user_id
      operationId: getLatestUserInfo
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: Последняя запись
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        "400":
          description: Неверный user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Данные не найдены для данного user_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    UserId:
      name: user_id
      in: query
      required: true
      description: UUID пользователя
      schema:
        type: string
        format: uuid
      example: "11111111-1111-1111-1111-111111111111"

  schemas:
    CreateUserInfoRequest:
      type: object
      required: [user_id, weight, height, age]
      properties:
        user_id:
          type: string
          format: uuid
          description: Идентификатор пользователя
        weight:
          type: number
          format: double
          minimum: 0
        height:
          type: integer
          format: int64
          minimum: 1
        age:
          type: integer
          format: int64
          minimum: 1
        date:
          type: string
          format: date
          description: Дата измерения (YYYY-MM-DD)
    UserInfoResponse:
      type: object
      required: [weight, height, age, date]
      properties:
        weight:
          type: number
          format: double
        height:
          type: integer
          format: int64
        age:
          type: integer
          format: int64
        date:
          type: string
          format: date
          description: Дата измерения (YYYY-MM-DD)
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
